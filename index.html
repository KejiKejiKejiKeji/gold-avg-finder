<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金藏品均价">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>新金色藏品均价查找器</title>
<style>
:root{
  --bg:#0b0b12;
  --bg-elev:#13131c;
  --card:#161622;
  --fg:#eaeaf0;
  --muted:#8b8ba3;
  --accent:#ffb300;
  --accent-dim:#ffb30033;
  --border:#2a2a3e;
  --radius:14px;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f4f8;
    --bg-elev:#ffffff;
    --card:#ffffff;
    --fg:#1a1a2e;
    --muted:#6b6b80;
    --accent:#e68a00;
    --accent-dim:#e68a0022;
    --border:#d0d0e0;
    --shadow:0 8px 24px rgba(0,0,0,.08);
  }
}
*, *::before, *::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{display:flex;flex-direction:column;min-height:100vh;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--card),transparent);
border-bottom:1px solid var(--border);padding:1rem .8rem;text-align:center}
h1{margin:0;font-size:clamp(1.05rem,2.5vw,1.25rem);font-weight:600;letter-spacing:.02em}
.sub{margin:.25rem 0 0;font-size:.75rem;color:var(--muted)}
main{flex:1;overflow:auto;padding:1rem .8rem;display:flex;flex-direction:column;gap:1rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
box-shadow:var(--shadow);padding:1rem}
@media (min-width:480px){.card{padding:1.25rem}}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
input[type=number]{width:100%;background:var(--bg-elev);border:1px solid var(--border);
border-radius:10px;padding:.85rem 1rem;font-size:1.1rem;color:var(--fg);outline:none;transition:border .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
button{width:100%;background:var(--accent);color:#07090c;border:none;border-radius:10px;
padding:.95rem 1rem;font-size:1rem;font-weight:600;letter-spacing:.02em;cursor:pointer;
transition:transform .08s,filter .15s,background .15s}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
#results{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
font-size:.8rem;line-height:1.6;white-space:pre-wrap;color:var(--fg);min-height:60px}
.item{padding:.55rem .75rem;margin:.35rem 0;background:var(--bg);border-radius:10px;
border:1px solid var(--border);transition:transform .12s,box-shadow .12s}
.item:hover,.item:focus-within{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem;font-size:.7rem;color:var(--muted)}
.badge{display:inline-block;padding:.1rem .45rem;border-radius:999px;
background:var(--accent-dim);color:var(--accent);font-size:.65rem;font-weight:600}
.item .detail{font-size:.7rem;color:var(--muted);margin-top:.15rem}
footer{padding:1rem .8rem;text-align:center;font-size:.7rem;color:var(--muted);
border-top:1px solid var(--border);margin-top:auto}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:420px){
  html{font-size:15px}
  .card{padding:.85rem}
}
@media (min-width:768px){
  main{max-width:640px;margin:0 auto;width:100%}
  header{padding:1.2rem 1rem}
}
@media (min-width:1024px){
  main{max-width:560px}
  .card{padding:1.5rem}
  h1{font-size:1.3rem}
}
.owned-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:.4rem;
  max-height:300px;
  overflow:auto;
  padding:.4rem 0;
}
.owned-item{
  display:flex;
  align-items:center;
  gap:.35rem;
  font-size:.75rem;
  padding:.2rem .4rem;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:8px;
}
.owned-item input{width:1rem;height:1rem;accent-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
<header>
<h1>新金色藏品均价查找器</h1>
<div class="sub">51 种金色藏品 · 总数 ≤ 20 · 每种动态上限 · 取整</div>
</header>
<main>
<details id="owned-section" class="card">
<summary>已拥有藏品（点击展开）</summary>
<div id="owned-list" class="owned-grid"></div>
</details>
<div class="card">
<label for="target">目标均价（整数）</label>
<input type="number" id="target" inputmode="numeric" placeholder="例：55168" autocomplete="off" aria-label="目标均价">
</div>
<div class="card">
<button id="btn">查找组合</button>
</div>
<div class="card" id="results" aria-live="polite" role="region" aria-label="查找结果"></div>
</main>
<footer>数据来源：ddangcalc 即刻落槌档案馆（1.4 版） · 算法：定向 DFS + 动态剪枝 ·
<a href="#" onclick="navigator.share?.({title:'金藏品均价查找器',url:location.href})">分享</a></footer>
</div>

<script>
// ===== 51种金色藏品价格（升序，ddangcalc 1.4版） =====
const PRICES = [
  4975,5041,5047,5555,7500,7547,7610,7648,9040,9938,
  11974,11981,12116,12164,13632,15024,15037,15108,15309,18031,
  18193,18288,19926,20238,21012,22297,22336,22770,22847,27159,
  27246,30211,30264,30452,37558,38316,51077,60040,60285,62456,
  76591,77777,80754,88888,101403,101537,101554,111111,124816,
  202798,271827
];
const NAMES = [
  "落日珍珠","光之方","第23页","海星","方盒科技智能手表","缄默花瓣","大满贯手握","桂冠","猫丸秘制豚骨拉面","绯红宝石",
  "自由数据线","方盒科技充电宝","方盒科技电容笔","骑士车贴","黄釉雅器","生春鞘","盈雪点翠","蓝焰火花塞","气象指南","名为尊贵的冠冕",
  "凝华海露","截云","缠枝花纹筷","万花筒","心猎铁骑L3-一以当千","絮语之种","心猎铁骑L2-闪焰冲锋","心猎铁骑L1-必杀一击","轮椅模型","浅绯祈手办",
  "强身好伙伴！","莓果总汇奶油长棍面包","海盐心迷宫","金龙鱼","灿金环","巡哨-干练精英","万有星仪","算力面包","澄空之眼","青花花瓶",
  "映像机","名为显赫的权杖","双颈玉瓶-白","片刻驻足","琉璃尾","条纹椰","赤色来电","金龙鱼","罐装随心泥","大饼","乔望尼金雕像"
];
const N = PRICES.length;
const MAX_TOTAL = 20;

// ===== 后缀 min/max =====
const suffixMin = new Array(N+1), suffixMax = new Array(N+1);
suffixMin[N]=Infinity; suffixMax[N]=0;
for(let i=N-1;i>=0;i--){
  suffixMin[i]=Math.min(PRICES[i],suffixMin[i+1]);
  suffixMax[i]=Math.max(PRICES[i],suffixMax[i+1]);
}

// ===== 动态最大数量 =====
function maxCounts(target){
  const mc=new Array(N).fill(0);
  for(let i=0;i<N;i++){
    const p=PRICES[i];
    if(p>target*2) mc[i]=0;
    else if(p>target*1.5) mc[i]=1;
    else if(p>target*1.2) mc[i]=1;
    else if(p>target*1.0) mc[i]=2;
    else if(p>target*0.7) mc[i]=2;
    else if(p>target*0.5) mc[i]=2;
    else if(p>target*0.3) mc[i]=3;
    else if(p>target*0.2) mc[i]=3;
    else if(p>target*0.15) mc[i]=3;
    else mc[i]=3;
  }
  return mc;
}

// ===== 初始化已拥有列表 =====
function initOwnedList(){
  const container=document.getElementById('owned-list');
  PRICES.forEach((price,i)=>{
    const div=document.createElement('label');
    div.className='owned-item';
    div.innerHTML=`<input type="checkbox" data-idx="${i}"><span>${NAMES[i]} · ${price}</span>`;
    container.appendChild(div);
  });
}
document.addEventListener('DOMContentLoaded',initOwnedList);

// ===== 核心搜索（支持已拥有） =====
function findCombinationsWithOwned(target){
  // 收集已拥有索引
  const ownedIdx=[];
  document.querySelectorAll('#owned-list input:checked').forEach(cb=>{
    ownedIdx.push(parseInt(cb.dataset.idx,10));
  });
  const ownedSet=new Set(ownedIdx);
  const fixedCount=ownedIdx.length;
  let fixedPrice=0;
  ownedIdx.forEach(i=>fixedPrice+=PRICES[i]);

  // 剩余物品
  const remIndices=[];
  for(let i=0;i<N;i++) if(!ownedSet.has(i)) remIndices.push(i);
  const remPrices=remIndices.map(i=>PRICES[i]);
  const remNames=remIndices.map(i=>NAMES[i]);
  const remN=remPrices.length;

  // 后缀 min/max for remaining
  const remSuffixMin=new Array(remN+1), remSuffixMax=new Array(remN+1);
  remSuffixMin[remN]=Infinity; remSuffixMax[remN]=0;
  for(let i=remN-1;i>=0;i--){
    remSuffixMin[i]=Math.min(remPrices[i],remSuffixMin[i+1]);
    remSuffixMax[i]=Math.max(remPrices[i],remSuffixMax[i+1]);
  }

  // 动态最大数量（基于 target）
  const remMaxCounts=new Array(remN).fill(0);
  for(let i=0;i<remN;i++){
    const p=remPrices[i];
    if(p>target*2) remMaxCounts[i]=0;
    else if(p>target*1.5) remMaxCounts[i]=1;
    else if(p>target*1.2) remMaxCounts[i]=1;
    else if(p>target*1.0) remMaxCounts[i]=2;
    else if(p>target*0.7) remMaxCounts[i]=2;
    else if(p>target*0.5) remMaxCounts[i]=2;
    else if(p>target*0.3) remMaxCounts[i]=3;
    else if(p>target*0.2) remMaxCounts[i]=3;
    else if(p>target*0.15) remMaxCounts[i]=3;
    else remMaxCounts[i]=3;
  }

  const results=[];
  let calls=0;
  const LIMIT=5_000_000;

  // total k from fixedCount+1 to MAX_TOTAL
  for(let totalK=fixedCount+1; totalK<=MAX_TOTAL; totalK++){
    const addK=totalK-fixedCount;
    const lower=target*totalK - fixedPrice;
    const upper=(target+1)*totalK - fixedPrice -1;
    if(lower>upper) continue;
    const minP=addK*remSuffixMin[0], maxP=addK*remSuffixMax[0];
    if(upper<minP || lower>maxP) continue;

    for(let addPrice=lower; addPrice<=upper; addPrice++){
      if(addPrice<minP || addPrice>maxP) continue;
      const path=new Array(remN).fill(0);
      dfsOwned(0,addK,addPrice,path,addPrice,remMaxCounts,remSuffixMin,remSuffixMax,()=>calls++,totalK,fixedCount,fixedPrice,remIndices,ownedIdx);
      if(calls>LIMIT) return results;
    }
  }
  return results;

  function dfsOwned(idx, remK, remP, path, addPrice, maxCountsArr, sMin, sMax, tick, totalK, fCount, fPrice, remIdxMap, ownedIdx){
    tick();
    if(idx===remN){
      if(remK===0 && remP===0){
        const fullCounts=new Array(N).fill(0);
        ownedIdx.forEach(i=>fullCounts[i]=1);
        path.forEach((c,j)=>{ if(c>0) fullCounts[remIdxMap[j]]=c; });
        const totalPrice=fPrice+addPrice;
        results.push({counts:fullCounts, totalCount:totalK, totalPrice, avgPrice:totalPrice/totalK});
      }
      return;
    }
    if(remK===0){
      if(remP===0){
        const fullCounts=new Array(N).fill(0);
        ownedIdx.forEach(i=>fullCounts[i]=1);
        path.forEach((c,j)=>{ if(c>0) fullCounts[remIdxMap[j]]=c; });
        const totalPrice=fPrice+addPrice;
        results.push({counts:fullCounts, totalCount:totalK, totalPrice, avgPrice:totalPrice/totalK});
      }
      return;
    }
    const minRem=remK*sMin[idx], maxRem=remK*sMax[idx];
    if(remP<minRem || remP>maxRem) return;

    const price=remPrices[idx];
    let maxC=Math.min(maxCountsArr[idx], remK, Math.floor(remP/price));
    const nextMin=sMin[idx+1]===Infinity?Infinity:sMin[idx+1];
    const nextMax=sMax[idx+1];

    let minC=0;
    if(price>nextMax) minC=Math.max(0, Math.ceil((remP - remK*nextMax)/(price-nextMax)));
    if(price>nextMin) maxC=Math.min(maxC, Math.floor((remP - remK*nextMin)/(price-nextMin)));

    minC=Math.max(0,minC);
    maxC=Math.min(maxCountsArr[idx], remK, maxC);
    if(minC>maxC) return;

    for(let c=maxC; c>=minC; c--){
      path[idx]=c;
      dfsOwned(idx+1, remK-c, remP-c*price, path, addPrice, maxCountsArr, sMin, sMax, tick, totalK, fCount, fPrice, remIdxMap, ownedIdx);
      path[idx]=0;
    }
  }
}

// ===== 格式化（使用 NAMES） =====
function fmtCombo(c){
  const parts=[];
  c.counts.forEach((cnt,i)=>{ if(cnt>0) parts.push(`${NAMES[i]} ${PRICES[i]}×${cnt}`); });
  return `[${parts.join(' + ')}]  总数:${c.totalCount}  总价:${c.totalPrice.toLocaleString()}  均价:${c.avgPrice.toFixed(2)}`;
}

// ===== UI 交互 =====
const $=id=>document.getElementById(id);
$('btn').onclick=()=>{
  const v=parseInt($('target').value,10);
  if(!v||v<1){ alert('请输入正整数'); return; }
  $('btn').disabled=true; $('btn').textContent='计算中...';
  $('results').innerHTML='';
  setTimeout(()=>{
    const res=findCombinationsWithOwned(v);
    res.sort((a,b)=>a.totalCount-b.totalCount);
    const top5=res.slice(0,5);
    if(top5.length===0){ $('results').textContent='未找到组合'; }
    else{
      $('results').innerHTML = top5.map((c,i)=>`<div class="item" tabindex="0"><div class="head"><span>#${i+1}</span><span class="badge">${c.totalCount}件</span></div><div>${fmtCombo(c).replace(/\[/,'<span style="color:var(--accent)">[').replace(/\]/,'}</span>').replace(/总数:(\d+)/,'总数:<b>$1</b>').replace(/总价:([\d,]+)/,'总价:<b>$1</b>').replace(/均价:([\d.]+)/,'均价:<b>$1</b>')}</div><div class="detail">实际均价 ${c.avgPrice.toFixed(2)}</div></div>`).join('');
    }
    $('btn').disabled=false; $('btn').textContent='查找组合';
  },0);
};
$('target').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn').click(); });

// ===== PWA: 注册 Service Worker =====
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
